<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ - Jen buď EPIC - Deskovka</title>
  <link rel="stylesheet" href="menu.css">
  <style>
    body {
      margin: 0;
      background: url("background.jpg") repeat;
      font-family: Georgia, "Times New Roman", serif;
      color: #3b2f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .title-image {
      max-width: 600px;
      width: 100%;
      height: auto;
    }
    main {
      max-width: 700px;
      width: 100%;
      box-sizing: border-box;
      text-align: left;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      padding: 30px 40px;
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      margin-top: 0;
    }
    .controls {
      display: grid;
      gap: 12px;
      margin: 24px 0;
    }
    .control-label {
      font-weight: bold;
    }
    input,
    select,
    button {
      font: inherit;
      color: #3b2f1e;
      border: 1px solid #8a785b;
      border-radius: 6px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.7);
      box-sizing: border-box;
    }
    input:focus,
    select:focus,
    button:focus {
      outline: 3px solid rgba(90, 74, 48, 0.35);
      outline-offset: 1px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input {
      flex: 1;
      min-width: 0;
    }
    button {
      cursor: pointer;
      background: #3b2f1e;
      color: #f5ecd7;
    }
    button:hover,
    a.back-link:hover {
      background: #5a4a30;
    }
    .result-count {
      margin: 0;
      font-weight: bold;
    }
    .result-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 14px;
    }
    .faq-list {
      display: grid;
      gap: 8px;
    }
    .faq-item {
      border-bottom: 1px solid rgba(59, 47, 30, 0.3);
    }
    .faq-item summary {
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      padding: 10px 4px;
    }
    .faq-item summary::marker {
      color: #5a4a30;
    }
    .faq-answer {
      padding: 0 4px 12px;
      line-height: 1.5;
    }
    .faq-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .faq-tag {
      border-radius: 12px;
      padding: 3px 9px;
      background: rgba(59, 47, 30, 0.12);
      font-size: 0.85em;
    }
    button.faq-tag {
      border: 0;
      color: #3b2f1e;
      padding: 3px 9px;
      background: rgba(59, 47, 30, 0.12);
      font-size: 0.85em;
    }
    button.faq-tag:hover,
    button.faq-tag[aria-pressed="true"] {
      background: rgba(59, 47, 30, 0.28);
    }
    .message {
      padding: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.45);
    }
    @media (max-width: 520px) {
      body {
        padding: 24px 12px;
      }
      main {
        padding: 24px 18px;
      }
      .search-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <img class="title-image" src="EPIC_title.png" alt="EPIC board game title">
  <main>
    <h1>Časté otázky (FAQ)</h1>
    <div class="controls">
      <label class="control-label" for="faq-search">Hledat v otázkách a odpovědích</label>
      <div class="search-row">
        <input id="faq-search" type="search" placeholder="Například: teleport, kouzla, vítězství" autocomplete="off">
        <button id="clear-search" type="button">Vymazat</button>
      </div>
      <label class="control-label" for="faq-tag">Filtrovat podle tématu</label>
      <div class="search-row">
        <select id="faq-tag">
          <option value="">Všechna témata</option>
        </select>
        <button id="clear-tag" type="button" hidden>Vymazat téma</button>
      </div>
    </div>
    <div class="result-row">
      <button id="collapse-all" type="button" hidden>Skryj vše</button>
      <p class="result-count" id="result-count" aria-live="polite">Načítám otázky…</p>
    </div>
    <div class="faq-list" id="faq-list">
      <p class="message">Načítám FAQ…</p>
    </div>
  </main>
  <script src="menu.js"></script>
  <script>
    const searchInput = document.querySelector("#faq-search");
    const tagSelect = document.querySelector("#faq-tag");
    const clearSearch = document.querySelector("#clear-search");
    const clearTag = document.querySelector("#clear-tag");
    const resultCount = document.querySelector("#result-count");
    const collapseAll = document.querySelector("#collapse-all");
    const faqList = document.querySelector("#faq-list");
    let questions = [];
    let tags = new Map();

    function normalize(value) {
      return value.toLocaleLowerCase("cs").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function parsePipeFile(text) {
      return text.trim().split(/\r?\n/).slice(1).map((line) => line.split("|"));
    }

    function render() {
      const query = normalize(searchInput.value.trim());
      const selectedTag = tagSelect.value;
      clearTag.hidden = !selectedTag;
      const matchingQuestions = questions.filter((item) => {
        const tagText = item.tagIds.map((tagId) => {
          const tag = tags.get(tagId);
          return `${tagId} ${tag?.name || ""} ${tag?.description || ""}`;
        }).join(" ");
        const searchableText = normalize(`${item.question} ${item.answer} ${tagText}`);
        return (!query || searchableText.includes(query))
          && (!selectedTag || item.tagIds.includes(selectedTag));
      });

      resultCount.textContent = matchingQuestions.length === 1
        ? "Nalezena 1 otázka"
        : `Nalezeno ${matchingQuestions.length} otázek`;
      collapseAll.hidden = matchingQuestions.length === 0;
      faqList.replaceChildren();

      if (matchingQuestions.length === 0) {
        const message = document.createElement("p");
        message.className = "message";
        message.textContent = "Tomuto hledání neodpovídá žádná otázka.";
        faqList.append(message);
        return;
      }

      matchingQuestions.forEach((item) => {
        const detail = document.createElement("details");
        detail.className = "faq-item";
        detail.open = true;
        const summary = document.createElement("summary");
        summary.textContent = item.question;
        const answer = document.createElement("div");
        answer.className = "faq-answer";
        answer.textContent = item.answer;
        const tagList = document.createElement("div");
        tagList.className = "faq-tags";
        item.tagIds.forEach((tagId) => {
          const tag = document.createElement("button");
          tag.type = "button";
          tag.className = "faq-tag";
          tag.textContent = tags.get(tagId)?.name || tagId;
          tag.setAttribute("aria-pressed", String(tagId === selectedTag));
          tag.addEventListener("click", () => {
            tagSelect.value = tagId === tagSelect.value ? "" : tagId;
            render();
          });
          tagList.append(tag);
        });
        answer.append(tagList);
        detail.append(summary, answer);
        faqList.append(detail);
      });
    }

    async function loadFaq() {
      const [faqResponse, tagsResponse] = await Promise.all([
        fetch("faq_cz.csv"),
        fetch("faq_tags_cz.csv")
      ]);
      if (!faqResponse.ok || !tagsResponse.ok) {
        throw new Error("FAQ data se nepodařilo načíst.");
      }

      tags = new Map(parsePipeFile(await tagsResponse.text()).map(([id, name, description]) => [
        id,
        { name, description }
      ]));
      questions = parsePipeFile(await faqResponse.text()).map(([id, tagIds, question, answer]) => ({
        id,
        tagIds: tagIds.split(","),
        question,
        answer
      }));

      [...tags.entries()]
        .sort(([, first], [, second]) => first.name.localeCompare(second.name, "cs"))
        .forEach(([id, tag]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = tag.name;
          tagSelect.append(option);
        });
      render();
    }

    searchInput.addEventListener("input", render);
    tagSelect.addEventListener("change", render);
    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      render();
      searchInput.focus();
    });
    clearTag.addEventListener("click", () => {
      tagSelect.value = "";
      render();
      tagSelect.focus();
    });
    collapseAll.addEventListener("click", () => {
      faqList.querySelectorAll("details.faq-item").forEach((detail) => {
        detail.open = false;
      });
    });
    loadFaq().catch((error) => {
      resultCount.textContent = "FAQ se nepodařilo načíst";
      faqList.replaceChildren();
      const message = document.createElement("p");
      message.className = "message";
      message.textContent = `${error.message} Zkontrolujte, že je stránka spuštěná přes webový server.`;
      faqList.append(message);
    });
  </script>
</body>
</html>
