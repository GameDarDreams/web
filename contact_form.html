
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt - Jen buď EPIC - Deskovka</title>
  <style>
    body {
      margin: 0;
      background: url("background.jpg") repeat;
      font-family: Georgia, "Times New Roman", serif;
      color: #3b2f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .title-image {
      max-width: 600px;
      width: 100%;
      height: auto;
    }
    main {
      max-width: 1000px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      padding: 30px 40px;
      margin-top: 20px;
    }
    h1 {
      margin-top: 0;
    }
    .form-wrapper {
      overflow: hidden;
      margin-top: 20px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
    }
    .form-wrapper iframe {
      display: block;
      width: 100%;
      height: 800px;
      border: 0;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #3b2f1e;
      color: #f5ecd7;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .back-link:hover {
      background: #5a4a30;
    }
    @media (max-width: 520px) {
      body {
        padding: 24px 12px;
      }
      main {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <img class="title-image" src="EPIC_title.png" alt="EPIC board game title">
  <main>
    <h1>Kontakt</h1>
    <div class="form-wrapper">
      <iframe
        data-tally-src="https://tally.so/r/q4rZQ5?dynamicHeight=1"
        title="Kontaktní formulář"
        loading="lazy">
      </iframe>
    </div>
    <a class="back-link" href="index.html">Zpět na hlavní stránku</a>
  </main>
  <script>
    const tallyEmbedScript = document.createElement("script");
    tallyEmbedScript.src = "https://tally.so/widgets/embed.js";
    tallyEmbedScript.onload = () => window.Tally?.loadEmbeds();
    document.body.append(tallyEmbedScript);
  </script>
</body>
</html>
